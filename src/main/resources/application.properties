spring.application.name=saberflow-backend

api.security.secret=${API_SECURITY_SECRET:default-dev-secret-123456}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5173}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${SABER_FLOW_DATABASE_PGHOST}:${SABER_FLOW_DATABASE_PGPORT}/${SABER_FLOW_DATABASE_POSTGRES_DATABASE}?sslmode=require
spring.datasource.username=${SABER_FLOW_DATABASE_PGUSER}
spring.datasource.password=${SABER_FLOW_DATABASE_PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Server
server.port=${PORT:8080}

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true